name: Build CardioDesk Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: CardioDesk_Desktop_v1
        run: npm install

      - name: Build CardioDesk
        uses: tauri-apps/tauri-action@action-v1.0.0
        with:
          projectPath: CardioDesk_Desktop_v1
          args: --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CardioDesk-Windows-x64
          path: CardioDesk_Desktop_v1/src-tauri/target/release/bundle/nsis/*.exe
